<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rayanabrand.aktau — балалар киімі, Ақтау</title>
<meta name="description" content="Rayanabrand.aktau — Ақтаудағы балалар киімі дүкені. Магазин детской одежды в Актау. Тапсырыс WhatsApp арқылы, Kaspi төлем. Заказ через WhatsApp, оплата Kaspi.">
<meta property="og:title" content="Rayanabrand.aktau">
<meta property="og:description" content="Балалар киімі, Ақтау · Детская одежда, Актау">
<meta property="og:image" content="icons/icon-512.png">
<meta name="theme-color" content="#FAF6F1">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rayanabrand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container header__in">
    <a href="#top" class="logo" aria-label="Rayanabrand.aktau">
      <span class="logo__mark">RB</span>
      <span class="logo__text">RAYANABRAND<small>.AKTAU</small></span>
    </a>

    <nav class="nav" id="nav">
      <a href="#catalog" data-i18n="nav_catalog"></a>
      <a href="#delivery" data-i18n="nav_delivery"></a>
      <a href="#payment" data-i18n="nav_payment"></a>
      <a href="#sizes" data-i18n="nav_sizes"></a>
      <a href="#contacts" data-i18n="nav_contacts"></a>
    </nav>

    <div class="header__actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-action="set-lang" data-lang="kz">KZ</button>
        <button type="button" data-action="set-lang" data-lang="ru">RU</button>
      </div>
      <a class="icon-btn hide-sm" data-link="instagram" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="fill"/></svg>
      </a>
      <a class="icon-btn hide-sm" data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9.2 8.4c0 3 2.6 6.4 6.4 6.4l.9-1.4-2-1-1 .8c-1-.5-2-1.5-2.4-2.5l.8-1-1-2z"/></svg>
      </a>
      <button type="button" class="icon-btn cart-btn" data-action="open-cart" aria-label="Cart">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="badge" id="cartCount">0</span>
      </button>
      <button type="button" class="icon-btn burger" data-action="burger" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- БАСТЫ / ГЛАВНАЯ -->
  <section class="hero" id="hero">
    <div class="container hero__in">
      <div class="seal" aria-hidden="true">
        <svg class="seal__ring" viewBox="0 0 200 200">
          <defs><path id="sealPath" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0"/></defs>
          <circle cx="100" cy="100" r="97"/>
          <circle cx="100" cy="100" r="63"/>
          <text><textPath href="#sealPath" textLength="498" lengthAdjust="spacing">RAYANABRAND ✦ AKTAU ✦ KAZAKHSTAN ✦ </textPath></text>
        </svg>
        <span class="seal__r">RB</span>
      </div>

      <h1 class="wordmark">
        <span class="wordmark__main">RAYANABRAND</span>
        <span class="wordmark__city"><i></i>.AKTAU<i></i></span>
      </h1>

      <p class="hero__tag" data-i18n="hero_title"></p>
      <p class="hero__text" data-i18n="hero_text"></p>
      <div class="hero__btns">
        <a href="#catalog" class="btn btn--gold" data-i18n="hero_btn_catalog"></a>
        <a class="btn btn--ghost" data-link="whatsapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9.2 8.4c0 3 2.6 6.4 6.4 6.4l.9-1.4-2-1-1 .8c-1-.5-2-1.5-2.4-2.5l.8-1-1-2z"/></svg>
          <span data-i18n="hero_btn_wa"></span>
        </a>
      </div>
      <ul class="hero__perks">
        <li id="perkDelivery"></li>
        <li data-i18n="perk_kaspi"></li>
        <li data-i18n="perk_sizes"></li>
      </ul>
    </div>
    <a href="#seasons-sec" class="hero__scroll" aria-label="Scroll"><span></span></a>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

  <!-- МАУСЫМДАР / СЕЗОНЫ -->
  <section class="section" id="seasons-sec">
    <div class="container">
      <div class="section__head section__head--center">
        <p class="kicker" data-i18n="seasons_kicker"></p>
        <h2 data-i18n="seasons_title"></h2>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>
  </section>

  <!-- КАТАЛОГ -->
  <section class="section" id="catalog">
    <div class="container">
      <div class="section__head">
        <div><p class="kicker" data-i18n="catalog_kicker"></p><h2 data-i18n="nav_catalog"></h2></div>
        <span class="found" id="found"></span>
      </div>

      <div class="genders" id="genders"></div>
      <div class="seasons" id="seasons"></div>

      <div class="toolbar">
        <button type="button" class="btn btn--outline btn--sm" data-action="toggle-filters" id="filtersBtn">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span data-i18n="filters"></span>
          <span class="dot-count" id="filtersCount" hidden></span>
        </button>
        <select id="sort" class="select select--sm" aria-label="Sort"></select>
      </div>

      <div class="filters" id="filters" hidden>
        <div class="filters__group">
          <h4 data-i18n="f_size"></h4>
          <div class="chips" id="fSizes"></div>
        </div>
        <div class="filters__group">
          <h4 data-i18n="f_color"></h4>
          <div class="swatches" id="fColors"></div>
        </div>
        <div class="filters__group">
          <h4 data-i18n="f_price"></h4>
          <div class="price-range">
            <input type="number" inputmode="numeric" min="0" step="500" id="fMin" class="input input--sm" data-i18n-ph="f_from">
            <span>—</span>
            <input type="number" inputmode="numeric" min="0" step="500" id="fMax" class="input input--sm" data-i18n-ph="f_to">
          </div>
        </div>
        <button type="button" class="link-btn" data-action="reset-filters" data-i18n="f_reset"></button>
      </div>

      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- ЖЕТКІЗУ / ДОСТАВКА -->
  <section class="section section--alt" id="delivery">
    <div class="container">
      <div class="section__head"><div><p class="kicker">Rayanabrand</p><h2 data-i18n="nav_delivery"></h2></div></div>
      <div class="notice" id="deliveryNotice"></div>
      <div class="info-grid" id="deliveryList"></div>
    </div>
  </section>

  <!-- ТӨЛЕМ / ОПЛАТА -->
  <section class="section" id="payment">
    <div class="container">
      <div class="section__head"><div><p class="kicker">Kaspi</p><h2 data-i18n="nav_payment"></h2></div></div>
      <div class="info-grid" id="paymentList"></div>
    </div>
  </section>

  <!-- ӨЛШЕМДЕР / РАЗМЕРЫ -->
  <section class="section section--alt" id="sizes">
    <div class="container">
      <div class="section__head"><div><p class="kicker">80 — 158 см</p><h2 data-i18n="sizes_title"></h2></div></div>
      <div class="table-wrap"><table class="size-table" id="sizeTable"></table></div>
      <p class="muted small" data-i18n="sizes_note"></p>
    </div>
  </section>

  <!-- БАЙЛАНЫС / КОНТАКТЫ -->
  <section class="section" id="contacts">
    <div class="container">
      <div class="section__head"><div><p class="kicker">Aktau</p><h2 data-i18n="nav_contacts"></h2></div></div>
      <div class="contacts" id="contactsList"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer__in">
    <a href="#top" class="footer__brand" aria-label="Rayanabrand.aktau">
      <span class="logo__mark logo__mark--lg">RB</span>
      <span class="footer__word">RAYANABRAND</span>
      <span class="footer__city">.AKTAU</span>
    </a>
    <nav class="footer__nav">
      <a href="#catalog" data-i18n="nav_catalog"></a>
      <a href="#delivery" data-i18n="nav_delivery"></a>
      <a href="#payment" data-i18n="nav_payment"></a>
      <a href="#sizes" data-i18n="nav_sizes"></a>
      <a href="#contacts" data-i18n="nav_contacts"></a>
    </nav>
    <div class="footer__social">
      <a data-link="instagram" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="fill"/></svg>
      </a>
      <a data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9.2 8.4c0 3 2.6 6.4 6.4 6.4l.9-1.4-2-1-1 .8c-1-.5-2-1.5-2.4-2.5l.8-1-1-2z"/></svg>
      </a>
      <a data-link="phone" aria-label="Phone">
        <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      </a>
    </div>
    <button type="button" class="install-btn" data-action="install" id="installBtn">
      <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M12 7.5v7M9 11.5l3 3 3-3"/></svg>
      <span data-i18n="install"></span>
    </button>
    <p class="footer__copy">© <span id="year"></span> Rayanabrand.aktau · <span data-i18n="footer_rights"></span></p>
  </div>
</footer>

<!-- WhatsApp қалқымалы батырма / Плавающая кнопка -->
<a class="wa-float" data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9.2 8.4c0 3 2.6 6.4 6.4 6.4l.9-1.4-2-1-1 .8c-1-.5-2-1.5-2.4-2.5l.8-1-1-2z"/></svg>
</a>

<!-- Тауар терезесі / Окно товара -->
<div class="overlay" id="modalOverlay" data-action="close-modal" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <button type="button" class="close-btn" data-action="close-modal" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="modal__body" id="modalBody"></div>
</div>

<!-- Себет / Корзина -->
<div class="overlay" id="cartOverlay" data-action="close-cart" hidden></div>
<aside class="drawer" id="cart" aria-label="Cart" hidden>
  <div class="drawer__head">
    <h3 data-i18n="cart"></h3>
    <button type="button" class="close-btn close-btn--static" data-action="close-cart" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer__scroll">
    <div id="cartItems"></div>

    <form id="orderForm" class="order" novalidate>
      <h4 data-i18n="checkout"></h4>
      <label class="field">
        <span data-i18n="f_name"></span>
        <input class="input" name="name" autocomplete="name" required>
      </label>
      <label class="field">
        <span data-i18n="f_phone"></span>
        <input class="input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __" required>
      </label>
      <label class="field">
        <span data-i18n="f_delivery"></span>
        <select class="select" name="delivery" id="deliverySelect"></select>
      </label>
      <label class="field" id="addressField">
        <span data-i18n="f_address"></span>
        <input class="input" name="address" autocomplete="street-address">
      </label>
      <label class="field">
        <span data-i18n="f_payment"></span>
        <select class="select" name="payment" id="paymentSelect"></select>
      </label>
      <label class="field">
        <span data-i18n="f_comment"></span>
        <textarea class="input" name="comment" rows="2"></textarea>
      </label>
      <p class="warn" id="minWarn" hidden></p>
      <p class="error" id="formError" hidden></p>
    </form>
  </div>
  <div class="drawer__foot" id="cartFoot">
    <div class="total-row"><span data-i18n="subtotal"></span><strong id="cartTotal">0 ₸</strong></div>
    <button type="submit" form="orderForm" class="btn btn--wa btn--block" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9.2 8.4c0 3 2.6 6.4 6.4 6.4l.9-1.4-2-1-1 .8c-1-.5-2-1.5-2.4-2.5l.8-1-1-2z"/></svg>
      <span data-i18n="send_order"></span>
    </button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
